[project]
name = "lending"
version = "0.1.0"
description = "A tiny library lending service used to demo Looply."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lending = "lending.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
